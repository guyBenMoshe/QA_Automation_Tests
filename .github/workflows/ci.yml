name: Run Selenium Tests

on: [push, pull_request] # הפעלת הבדיקות בכל push או pull request

jobs:
  test:
    runs-on: ubuntu-latest # מערכת הפעלה שבה הבדיקות ירוצו

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # שליפת הקוד מ-GitHub

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9" # הגדרת גרסת פייתון

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install selenium pytest webdriver-manager pytest-html

      - name: Run tests
        run: python run_tests.py # הפעלת הבדיקות

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html # העלאת הדוח שנוצר ל-GitHub
